<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Color Harmony Wheel & Palette Builder</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { background:#f8fafc; font-family:system-ui,sans-serif; }
  .swatch { width:64px; height:64px; border-radius:12px; cursor:pointer; transition:transform 0.15s; flex-shrink:0; }
  .swatch:hover { transform:scale(1.1); }
  .harmony-card { background:#fff; border:1px solid #e2e8f0; border-radius:16px; padding:16px; }
  .badge-aa { background:#16a34a; color:#fff; font-size:10px; padding:2px 6px; border-radius:4px; }
  .badge-aaa { background:#2563eb; color:#fff; font-size:10px; padding:2px 6px; border-radius:4px; }
  .badge-fail { background:#dc2626; color:#fff; font-size:10px; padding:2px 6px; border-radius:4px; }
  .toast { position:fixed; bottom:24px; right:24px; background:#1e293b; color:#fff; padding:10px 20px; border-radius:10px; font-size:14px; opacity:0; transition:opacity 0.3s; pointer-events:none; z-index:999; }
  .toast.show { opacity:1; }
  .code-block { background:#1e293b; color:#93c5fd; border-radius:8px; font-family:monospace; font-size:12px; padding:12px; white-space:pre; overflow-x:auto; }
</style>
</head>
<body class="min-h-screen p-4">
<div class="toast" id="toast">Copied!</div>
<div class="max-w-4xl mx-auto">
  <h1 class="text-2xl font-bold text-gray-800 text-center mb-1">🎨 Color Harmony Wheel</h1>
  <p class="text-gray-500 text-sm text-center mb-6">Click the wheel to select a base hue and generate harmony palettes</p>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
    <!-- Wheel -->
    <div class="bg-white rounded-2xl shadow p-6 flex flex-col items-center">
      <canvas id="colorWheel" width="260" height="260" class="cursor-crosshair rounded-full" aria-label="Color harmony wheel, click to select hue"></canvas>
      <div class="mt-4 flex items-center gap-4">
        <div id="selectedSwatch" class="w-12 h-12 rounded-xl border border-gray-200 shadow"></div>
        <div>
          <div class="text-xs text-gray-500">Selected Hue</div>
          <div id="selectedHex" class="text-lg font-bold text-gray-800 font-mono">#——</div>
          <div id="selectedHsl" class="text-xs text-gray-400"></div>
        </div>
      </div>
      <div class="mt-4 w-full">
        <label class="text-xs text-gray-500 block mb-1" for="satSlider">Saturation: <span id="satVal">80</span>%</label>
        <input type="range" id="satSlider" min="20" max="100" value="80" class="w-full" aria-label="Saturation" oninput="onSatChange(this.value)">
      </div>
    </div>

    <!-- Harmony schemes -->
    <div class="space-y-4 overflow-y-auto max-h-[480px] pr-1" id="harmonyPanels">
      <p class="text-gray-400 text-sm text-center pt-8">Click the wheel to generate palettes</p>
    </div>
  </div>

  <!-- Export -->
  <div class="bg-white rounded-2xl shadow p-6 mt-6" id="exportPanel" style="display:none">
    <h2 class="text-sm font-semibold text-gray-700 mb-3">Export</h2>
    <div class="flex flex-wrap gap-3 mb-4">
      <button onclick="exportCSS()" class="px-4 py-2 rounded-lg text-sm font-semibold text-white" style="background:#6366f1" aria-label="Export as CSS custom properties">CSS Variables</button>
      <button onclick="exportSCSS()" class="px-4 py-2 rounded-lg text-sm font-semibold text-white" style="background:#8b5cf6" aria-label="Export as SCSS variables">SCSS Variables</button>
      <button onclick="downloadPNG()" class="px-4 py-2 rounded-lg text-sm font-semibold text-white" style="background:#0891b2" aria-label="Download swatch PNG">Download PNG</button>
    </div>
    <div id="exportCode" class="code-block"></div>
  </div>
</div>

<script>
function escapeHtml(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

let baseHue = 200;
let saturation = 80;
let currentPalette = [];

const canvas = document.getElementById('colorWheel');
const ctx = canvas.getContext('2d');
const cx = 130, cy = 130, R = 120;

function drawWheel() {
  ctx.clearRect(0,0,260,260);
  for (let angle = 0; angle < 360; angle += 0.5) {
    const rad = (angle - 90) * Math.PI / 180;
    const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, R);
    grad.addColorStop(0, `hsl(${angle},${saturation}%,90%)`);
    grad.addColorStop(0.5, `hsl(${angle},${saturation}%,60%)`);
    grad.addColorStop(1, `hsl(${angle},${saturation}%,40%)`);
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, R, (angle-90.5)*Math.PI/180, (angle-89.5+0.5)*Math.PI/180);
    ctx.closePath();
    ctx.fillStyle = grad;
    ctx.fill();
  }
  // Draw selector
  const selRad = (baseHue - 90) * Math.PI / 180;
  const selDist = R * 0.7;
  const sx = cx + Math.cos(selRad) * selDist;
  const sy = cy + Math.sin(selRad) * selDist;
  ctx.beginPath();
  ctx.arc(sx, sy, 8, 0, Math.PI*2);
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 3;
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(sx, sy, 5, 0, Math.PI*2);
  ctx.fillStyle = `hsl(${baseHue},${saturation}%,60%)`;
  ctx.fill();
}

function hslToHex(h, s, l) {
  s /= 100; l /= 100;
  const a = s * Math.min(l, 1-l);
  const f = n => { const k = (n + h/30) % 12; return l - a*Math.max(Math.min(k-3,9-k,1),-1); };
  const r = Math.round(f(0)*255), g = Math.round(f(8)*255), b = Math.round(f(4)*255);
  return '#' + [r,g,b].map(x => x.toString(16).padStart(2,'0')).join('');
}

function hexToRGB(hex) {
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return {r,g,b};
}

function luminance(hex) {
  const {r,g,b} = hexToRGB(hex);
  const sRGB = [r,g,b].map(v => { v /= 255; return v <= 0.04045 ? v/12.92 : Math.pow((v+0.055)/1.055, 2.4); });
  return 0.2126*sRGB[0] + 0.7152*sRGB[1] + 0.0722*sRGB[2];
}

function contrastRatio(c1, c2) {
  const l1 = luminance(c1), l2 = luminance(c2);
  const bright = Math.max(l1,l2), dark = Math.min(l1,l2);
  return (bright + 0.05) / (dark + 0.05);
}

function contrastBadge(hex) {
  const cw = contrastRatio(hex, '#ffffff');
  const cb = contrastRatio(hex, '#000000');
  const best = Math.max(cw, cb);
  const against = best === cw ? 'vs white' : 'vs black';
  let badge;
  if (best >= 7) badge = `<span class="badge-aaa">AAA ${best.toFixed(1)}:1</span>`;
  else if (best >= 4.5) badge = `<span class="badge-aa">AA ${best.toFixed(1)}:1</span>`;
  else badge = `<span class="badge-fail">FAIL ${best.toFixed(1)}:1</span>`;
  return badge + ` <span class="text-gray-400 text-xs">${escapeHtml(against)}</span>`;
}

function getHarmonies(h, s) {
  const L = 60;
  return [
    { name: 'Complementary', colors: [
      {h, hex: hslToHex(h,s,L)},
      {h: (h+180)%360, hex: hslToHex((h+180)%360,s,L)}
    ]},
    { name: 'Analogous', colors: [
      {h: (h-30+360)%360, hex: hslToHex((h-30+360)%360,s,L)},
      {h, hex: hslToHex(h,s,L)},
      {h: (h+30)%360, hex: hslToHex((h+30)%360,s,L)}
    ]},
    { name: 'Triadic', colors: [
      {h, hex: hslToHex(h,s,L)},
      {h: (h+120)%360, hex: hslToHex((h+120)%360,s,L)},
      {h: (h+240)%360, hex: hslToHex((h+240)%360,s,L)}
    ]},
    { name: 'Split-Complementary', colors: [
      {h, hex: hslToHex(h,s,L)},
      {h: (h+150)%360, hex: hslToHex((h+150)%360,s,L)},
      {h: (h+210)%360, hex: hslToHex((h+210)%360,s,L)}
    ]},
    { name: 'Tetradic / Square', colors: [
      {h, hex: hslToHex(h,s,L)},
      {h: (h+90)%360, hex: hslToHex((h+90)%360,s,L)},
      {h: (h+180)%360, hex: hslToHex((h+180)%360,s,L)},
      {h: (h+270)%360, hex: hslToHex((h+270)%360,s,L)}
    ]}
  ];
}

function renderHarmonies() {
  const harmonies = getHarmonies(baseHue, saturation);
  currentPalette = harmonies.flatMap(h => h.colors.map(c => c.hex));
  const panel = document.getElementById('harmonyPanels');
  panel.innerHTML = harmonies.map(h => `
    <div class="harmony-card">
      <div class="text-sm font-semibold text-gray-700 mb-3">${escapeHtml(h.name)}</div>
      <div class="flex gap-3 flex-wrap">
        ${h.colors.map(c => `
          <div class="flex flex-col items-center gap-1">
            <div class="swatch" style="background:${escapeHtml(c.hex)}" onclick="copyHex('${escapeHtml(c.hex)}')" role="button" tabindex="0" aria-label="Color swatch ${escapeHtml(c.hex)}, click to copy" onkeydown="if(event.key==='Enter')copyHex('${escapeHtml(c.hex)}')"></div>
            <div class="text-xs font-mono text-gray-600 cursor-pointer hover:text-indigo-600" onclick="copyHex('${escapeHtml(c.hex)}')">${escapeHtml(c.hex)}</div>
            <div>${contrastBadge(c.hex)}</div>
          </div>
        `).join('')}
      </div>
    </div>
  `).join('');
  document.getElementById('exportPanel').style.display = '';
}

function copyHex(hex) {
  navigator.clipboard.writeText(hex).then(() => showToast('Copied ' + hex));
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1800);
}

function exportCSS() {
  const unique = [...new Set(currentPalette)];
  const code = ':root {\n' + unique.map((c,i) => `  --color-${i+1}: ${c};`).join('\n') + '\n}';
  document.getElementById('exportCode').textContent = code;
  navigator.clipboard.writeText(code).then(() => showToast('CSS copied!'));
}

function exportSCSS() {
  const unique = [...new Set(currentPalette)];
  const code = unique.map((c,i) => `$color-${i+1}: ${c};`).join('\n');
  document.getElementById('exportCode').textContent = code;
  navigator.clipboard.writeText(code).then(() => showToast('SCSS copied!'));
}

function downloadPNG() {
  const unique = [...new Set(currentPalette)];
  const sw = 80, sh = 80, pad = 10;
  const oc = document.createElement('canvas');
  oc.width = unique.length * (sw + pad) + pad;
  oc.height = sh + pad * 2;
  const octx = oc.getContext('2d');
  octx.fillStyle = '#f8fafc';
  octx.fillRect(0,0,oc.width,oc.height);
  unique.forEach((c,i) => {
    octx.fillStyle = c;
    octx.beginPath();
    const x = pad + i*(sw+pad), y = pad;
    octx.roundRect ? octx.roundRect(x,y,sw,sh,10) : octx.rect(x,y,sw,sh);
    octx.fill();
    octx.fillStyle = '#333';
    octx.font = '11px monospace';
    octx.textAlign = 'center';
    octx.fillText(c, x+sw/2, y+sh+14);
  });
  const a = document.createElement('a');
  a.href = oc.toDataURL();
  a.download = 'palette.png';
  a.click();
}

function onSatChange(v) {
  saturation = parseInt(v);
  document.getElementById('satVal').textContent = v;
  drawWheel();
  if (baseHue !== null) updateSelected();
  if (document.getElementById('harmonyPanels').querySelector('.harmony-card')) renderHarmonies();
}

function updateSelected() {
  const hex = hslToHex(baseHue, saturation, 60);
  document.getElementById('selectedSwatch').style.background = hex;
  document.getElementById('selectedHex').textContent = hex;
  document.getElementById('selectedHsl').textContent = `hsl(${baseHue}, ${saturation}%, 60%)`;
}

canvas.addEventListener('click', e => {
  const rect = canvas.getBoundingClientRect();
  const x = e.clientX - rect.left - cx;
  const y = e.clientY - rect.top - cy;
  const dist = Math.sqrt(x*x+y*y);
  if (dist > R + 5) return;
  baseHue = Math.round((Math.atan2(y, x) * 180 / Math.PI + 90 + 360) % 360);
  drawWheel();
  updateSelected();
  renderHarmonies();
});

drawWheel();
updateSelected();
</script>
</body>
</html>
